<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishER Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">KnowBe4 PhishER - SOC Console</div>
    <div class="top-actions">
      <input id="global-search" aria-label="Search incidents globally" placeholder="Search reporter, subject, sender, domain" />
      <button id="reset-data" aria-label="Reset simulator data">Reset Data</button>
    </div>
  </header>

  <main class="three-pane" aria-label="Phishing incident triage interface">
    <section class="pane pane-left" aria-label="Incident inbox pane">
      <div class="pane-title">Inbox</div>
      <div class="filters">
        <label>PhishML
          <select id="filter-phishml" aria-label="Filter by PhishML">
            <option value="all">All</option>
            <option value="threat">Threat</option>
            <option value="spam">Spam</option>
            <option value="clean">Clean</option>
          </select>
        </label>
        <label>Priority
          <select id="filter-priority" aria-label="Filter by priority">
            <option value="all">All</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label>Status
          <select id="filter-status" aria-label="Filter by status">
            <option value="all">All</option>
            <option value="received">Received</option>
            <option value="in_review">In Review</option>
            <option value="resolved">Resolved</option>
          </select>
        </label>
      </div>
      <div id="inbox-list" class="inbox-list" role="list" aria-label="Incident list"></div>
    </section>

    <section class="pane pane-center" aria-label="Message analysis pane">
      <div id="message-view"></div>
    </section>

    <aside class="pane pane-right" aria-label="Action and disposition pane">
      <div class="pane-title">Actions</div>
      <div id="action-sidebar"></div>
    </aside>
  </main>

  <div id="phishrip-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="PhishRIP processing dialog">
    <div class="modal-card">
      <h3>PhishRIP Search and Destroy</h3>
      <p id="phishrip-status">Searching organization mailboxes...</p>
      <div class="progress">
        <div id="phishrip-progress" class="progress-bar"></div>
      </div>
      <button id="close-modal" aria-label="Close PhishRIP result dialog">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
